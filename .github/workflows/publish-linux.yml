name: Publish Linux build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-linux-build-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out image sources
        uses: actions/checkout@v6

      - name: Select image tags
        id: metadata
        env:
          IMAGE_NAME: linux-build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          tags="${image}:latest
          ${image}:ubuntu-26.04
          ${image}:sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid image release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tags="${tags}
          ${image}:${GITHUB_REF_NAME#v}"
          fi

          {
            echo "image=${image}"
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: linux/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/linux-build:ubuntu-26.04
            type=gha,scope=linux-build-image
          cache-to: |
            type=inline
            type=gha,mode=max,scope=linux-build-image,ignore-error=true
