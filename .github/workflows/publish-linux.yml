name: Publish Linux build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Publish all qualified Linux-owned images as commit-addressed candidates
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-linux-build-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select image tags
        id: metadata
        env:
          IMAGE_NAME: linux-build
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          if [[ "${CANDIDATE_ONLY}" == true ]]; then
            tags="${image}:candidate-sha-${GITHUB_SHA}"
          else
            tags="${image}:latest
            ${image}:ubuntu-26.04
            ${image}:sha-${GITHUB_SHA}"
          fi

          if [[ "${CANDIDATE_ONLY}" != true \
              && "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid image release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tags="${tags}
          ${image}:${GITHUB_REF_NAME#v}"
          fi

          {
            echo "image=${image}"
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Select Classic image tags
        id: classic-metadata
        env:
          IMAGE_NAME: classic-build
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          if [[ "${CANDIDATE_ONLY}" == true ]]; then
            tags="${image}:candidate-sha-${GITHUB_SHA}"
          else
            tags="${image}:latest
            ${image}:ubuntu-26.04
            ${image}:sha-${GITHUB_SHA}"
          fi

          if [[ "${CANDIDATE_ONLY}" != true \
              && "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid image release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tags="${tags}
          ${image}:${GITHUB_REF_NAME#v}"
          fi

          {
            echo "image=${image}"
            echo 'tags<<EOF'
            echo "${tags}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared LLVM source toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          target: llvm-toolchain
          build-args: LLVM_BUILD_JOBS=2
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=llvm-toolchain-23.1.3
          cache-to: type=gha,mode=max,scope=llvm-toolchain-23.1.3,ignore-error=true

      # Prove every Linux-owned image contract before moving any release tag.
      - name: Build and smoke Classic validation target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: classic-validation
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=registry,ref=ghcr.io/atrinik/classic-build:ubuntu-26.04
            type=gha,scope=classic-build-image-llvm-23.1.3
          cache-to: type=gha,mode=max,scope=classic-build-image-llvm-23.1.3,ignore-error=true

      - name: Read Classic cancellation qualification consumer
        id: curl-consumer
        run: echo "commit=$(jq -er '.consumer_validation.commit' classic-toolchain.json)" >> "${GITHUB_OUTPUT}"

      - name: Check out Classic cancellation qualification consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.curl-consumer.outputs.commit }}
          path: build/curl-classic
          persist-credentials: false

      - name: Load Classic cancellation qualification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: classic-final
          platforms: linux/amd64
          load: true
          tags: atrinik-classic-curl:qualification
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=classic-build-image-llvm-23.1.3

      - name: Qualify Classic cancellation and public TLS before publication
        run: tools/smoke-classic-curl.sh atrinik-classic-curl:qualification build/curl-classic

      - name: Run Classic client and server checks before publication
        run: |
          install -d -m 1777 "${RUNNER_TEMP}/classic-ccache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CCACHE_DIR=/cache/ccache --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/image-source:ro" \
            --volume "${GITHUB_WORKSPACE}/build/curl-classic:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache:/cache/ccache" \
            --workdir /workspace atrinik-classic-curl:qualification \
            /image-source/tools/validate-classic-check.sh /workspace

      - name: Build and smoke broad Linux validation target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: validation
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=linux-build-image-llvm-23.1.3
          cache-to: type=gha,mode=max,scope=linux-build-image-llvm-23.1.3,ignore-error=true

      - name: Load broad Linux cancellation qualification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: final
          platforms: linux/amd64
          load: true
          tags: atrinik-linux-curl:qualification
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=linux-build-image-llvm-23.1.3

      - name: Qualify broad Linux cancellation and public TLS before publication
        run: tools/smoke-classic-curl.sh atrinik-linux-curl:qualification build/curl-classic

      # The portable target has its own ABI and real consumer; validate it before aliases move.
      - name: Read portable consumer revision
        id: portable-consumer
        run: echo "commit=$(jq -er '.consumer.commit' portable/contract.json)" >> "${GITHUB_OUTPUT}"

      - name: Check out portable Classic consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.portable-consumer.outputs.commit }}
          path: build/portable-classic
          persist-credentials: false

      - name: Check portable Dockerfile
        run: docker build --check --file portable/Dockerfile .

      - name: Validate portable baseline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: portable/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: portable-validation
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=classic-portable-build-image-llvm-23.1.3
          cache-to: type=gha,mode=max,scope=classic-portable-build-image-llvm-23.1.3,ignore-error=true

      - name: Load portable release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: portable/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: portable-final
          platforms: linux/amd64
          load: true
          tags: atrinik-classic-portable:release-validation
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=classic-portable-build-image-llvm-23.1.3

      - name: Verify portable candidate public CA
        shell: bash
        run: |
          set -euo pipefail
          install -d build/portable-reports
          docker run --rm --network bridge \
            --user "$(id -u):$(id -g)" --env HOME=/tmp/portable-tls-home \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env no_proxy= \
            --volume "${GITHUB_WORKSPACE}/build/portable-classic/client/ca-bundle.crt:/workspace/client/ca-bundle.crt:ro" \
            atrinik-classic-portable:release-validation \
            python3 /opt/atrinik-portable/curl_evidence.py \
            --public-ca /workspace/client/ca-bundle.crt \
            | tee build/portable-reports/public-ca.json

      - name: Validate real portable consumer before publication
        run: |
          install -d build/portable-reports
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" --env HOME=/tmp/portable-home \
            --volume "${GITHUB_WORKSPACE}/build/portable-classic:/classic:ro" \
            --volume "${GITHUB_WORKSPACE}/build/portable-reports:/reports" \
            atrinik-classic-portable:release-validation \
            /opt/atrinik-portable/consumer.sh /classic /reports

      - name: Build and publish Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=registry,ref=ghcr.io/atrinik/linux-build:ubuntu-26.04
            type=gha,scope=linux-build-image-llvm-23.1.3
          cache-to: |
            type=inline
            type=gha,mode=max,scope=linux-build-image-llvm-23.1.3,ignore-error=true

      - name: Build and publish Classic image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: linux/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: classic-final
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.classic-metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=registry,ref=ghcr.io/atrinik/classic-build:ubuntu-26.04
            type=gha,scope=classic-build-image-llvm-23.1.3
          cache-to: |
            type=inline
            type=gha,mode=max,scope=classic-build-image-llvm-23.1.3,ignore-error=true

      - name: Select immutable portable tag
        id: portable-metadata
        env:
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/classic-portable-build"
          if [[ "${CANDIDATE_ONLY}" == true ]]; then
            echo "tag=${image}:candidate-sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${image}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish immutable portable candidate
        id: portable-publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: portable/Dockerfile
          build-args: LLVM_BUILD_JOBS=2
          target: portable-final
          platforms: linux/amd64
          push: true
          tags: ${{ steps.portable-metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=gha,scope=classic-portable-build-image-llvm-23.1.3

      - name: Promote validated portable aliases
        if: ${{ !inputs.candidate_only }}
        env:
          PORTABLE_DIGEST: ${{ steps.portable-publish.outputs.digest }}
        run: |
          [[ "${PORTABLE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/classic-portable-build"
          tags=(--tag "${image}:latest" --tag "${image}:debian-12")
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tags+=(--tag "${image}:${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${tags[@]}" "${image}@${PORTABLE_DIGEST}"
          printf '%s@%s\n' "${image}" "${PORTABLE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
