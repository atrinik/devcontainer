name: Publish Windows build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Publish qualified immutable candidates without promoting aliases
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-windows-build-image
  cancel-in-progress: false

jobs:
  publish-candidates:
    name: Publish immutable candidates
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      check_digest: ${{ steps.check-image.outputs.digest }}
      general_digest: ${{ steps.general-image.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select image tags
        id: metadata
        env:
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/windows-build"

          if [[ "${CANDIDATE_ONLY}" != true \
              && "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid image release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          if [[ "${CANDIDATE_ONLY}" == true ]]; then
            general_tag="${image}:candidate-sha-${GITHUB_SHA}"
            check_tag="${image}:classic-check-candidate-sha-${GITHUB_SHA}"
          else
            general_tag="${image}:sha-${GITHUB_SHA}"
            check_tag="${image}:classic-check-sha-${GITHUB_SHA}"
          fi
          {
            echo "image=${image}"
            echo "general_sha_tag=${general_tag}"
            echo "check_sha_tag=${check_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Select immutable Classic Check consumer
        id: classic
        run: |
          classic_ref=$(jq -er '.consumer.validation_commit' \
            windows/classic-check-toolchain.json)
          if [[ ! "${classic_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Classic validation commit: ${classic_ref}" >&2
            exit 1
          fi
          echo "ref=${classic_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out immutable Classic Check consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.classic.outputs.ref }}
          path: build/classic
          persist-credentials: false

      - name: Verify pinned Classic dependency releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/verify_classic_check_dependencies.py \
            build/classic windows/classic-check-toolchain.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared LLVM source toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: windows/Dockerfile
          target: llvm-toolchain
          build-args: LLVM_BUILD_JOBS=2
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=llvm-toolchain-23.1.3
          cache-to: type=gha,mode=max,scope=llvm-toolchain-23.1.3,ignore-error=true

      - name: Build and publish immutable Windows candidate
        id: general-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: windows/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.general_sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=registry,ref=ghcr.io/atrinik/windows-build:llvm
            type=gha,scope=windows-build-image-llvm-23.1.3
          cache-to: |
            type=inline
            type=gha,mode=max,scope=windows-build-image-llvm-23.1.3,ignore-error=true
          build-args: |
            LLVM_BUILD_JOBS=2
            WINDOWS_BUILD_JOBS=2

      - name: Build and publish immutable Classic Check candidate
        id: check-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: windows/Dockerfile
          target: classic-check
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.check_sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=llvm-toolchain-23.1.3
            type=registry,ref=ghcr.io/atrinik/windows-build:classic-check-llvm
            type=registry,ref=ghcr.io/atrinik/windows-build:llvm
            type=gha,scope=windows-classic-check-image-llvm-23.1.3
            type=gha,scope=windows-build-image-llvm-23.1.3
          cache-to: |
            type=inline
            type=gha,mode=max,scope=windows-classic-check-image-llvm-23.1.3,ignore-error=true
          build-args: |
            LLVM_BUILD_JOBS=2
            WINDOWS_BUILD_JOBS=2

      - name: Smoke the published Classic Check digest
        env:
          CHECK_DIGEST: ${{ steps.check-image.outputs.digest }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          if [[ ! "${CHECK_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Classic Check digest: ${CHECK_DIGEST}" >&2
            exit 1
          fi
          docker buildx imagetools inspect \
            "${IMAGE}@${CHECK_DIGEST}" >/dev/null
          tools/smoke-classic-check.sh \
            "${IMAGE}@${CHECK_DIGEST}" build/classic

      - name: Smoke the published general digest
        env:
          GENERAL_DIGEST: ${{ steps.general-image.outputs.digest }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          if [[ ! "${GENERAL_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid general Windows digest: ${GENERAL_DIGEST}" >&2
            exit 1
          fi
          docker buildx imagetools inspect \
            "${IMAGE}@${GENERAL_DIGEST}" >/dev/null
          docker run --rm --user vscode "${IMAGE}@${GENERAL_DIGEST}" \
            sh -eu -c '
              x86_64-w64-mingw32-clang --version | grep -F "23.1.3"
              test -f "${ATRINIK_WINDOWS_TOOLCHAIN_FILE}"
              x86_64-w64-mingw32-pkg-config --exists libcurl sdl3-mixer
              test -f "${ATRINIK_WINDOWS_PYTHON_LIBRARY}"
              test -f "${ATRINIK_WINDOWS_PYTHON_RUNTIME_DIR}/python314.dll"
            '

      - name: Upload release native Windows test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: classic-check-release-native-windows-tests
          path: build/classic/libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

  windows-native:
    name: Verify immutable Classic Check candidate on Windows
    needs: publish-candidates
    permissions: {}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download release native Windows test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: classic-check-release-native-windows-tests
          path: build/native-windows-tests

      - name: Execute every Classic Check native test
        shell: pwsh
        run: |
          & (Join-Path (Resolve-Path "build/native-windows-tests").Path "run-classic-native-tests.ps1")
  promote:
    name: Promote verified Windows image aliases
    if: ${{ !inputs.candidate_only }}
    needs:
      - publish-candidates
      - windows-native
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified Classic Check aliases
        env:
          DIGEST: ${{ needs.publish-candidates.outputs.check_digest }}
          IMAGE: ${{ needs.publish-candidates.outputs.image }}
        run: |
          tags=(
            --tag "${IMAGE}:classic-check"
            --tag "${IMAGE}:classic-check-llvm"
          )
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tags+=(--tag "${IMAGE}:classic-check-${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"

      - name: Promote verified general Windows aliases
        env:
          DIGEST: ${{ needs.publish-candidates.outputs.general_digest }}
          IMAGE: ${{ needs.publish-candidates.outputs.image }}
        run: |
          tags=(--tag "${IMAGE}:latest" --tag "${IMAGE}:llvm")
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tags+=(--tag "${IMAGE}:${GITHUB_REF_NAME#v}")
          fi
          if ! docker buildx imagetools create \
              "${tags[@]}" "${IMAGE}@${DIGEST}"; then
            echo "General alias promotion failed after Classic promotion." >&2
            echo "Rerun this failed job in the same workflow run to converge" >&2
            echo "both alias sets on the already verified candidate digests." >&2
            exit 1
          fi
