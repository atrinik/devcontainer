name: Publish Windows build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-windows-build-image
  cancel-in-progress: false

jobs:
  publish-candidates:
    name: Publish immutable candidates
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    outputs:
      check_digest: ${{ steps.check-image.outputs.digest }}
      general_digest: ${{ steps.general-image.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select image tags
        id: metadata
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/windows-build"

          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid image release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          {
            echo "image=${image}"
            echo "general_sha_tag=${image}:sha-${GITHUB_SHA}"
            echo "check_sha_tag=${image}:classic-check-sha-${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Select immutable Classic Check consumer
        id: classic
        run: |
          classic_ref=$(jq -er '.consumer.validation_commit' \
            windows/classic-check-toolchain.json)
          if [[ ! "${classic_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Classic validation commit: ${classic_ref}" >&2
            exit 1
          fi
          echo "ref=${classic_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out immutable Classic Check consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.classic.outputs.ref }}
          path: build/classic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Windows candidate
        id: general-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.general_sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/windows-build:mxe
            type=gha,scope=windows-build-image
          cache-to: |
            type=inline
            type=gha,mode=max,scope=windows-build-image,ignore-error=true
          build-args: MXE_BUILD_JOBS=4

      - name: Build and publish immutable Classic Check candidate
        id: check-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          target: classic-check
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.check_sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/windows-build:classic-check-mxe
            type=registry,ref=ghcr.io/atrinik/windows-build:mxe
            type=gha,scope=windows-classic-check-image
            type=gha,scope=windows-build-image
          cache-to: |
            type=inline
            type=gha,mode=max,scope=windows-classic-check-image,ignore-error=true
          build-args: MXE_BUILD_JOBS=4

      - name: Smoke the published Classic Check digest
        env:
          CHECK_DIGEST: ${{ steps.check-image.outputs.digest }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          if [[ ! "${CHECK_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Classic Check digest: ${CHECK_DIGEST}" >&2
            exit 1
          fi
          docker buildx imagetools inspect \
            "${IMAGE}@${CHECK_DIGEST}" >/dev/null
          tools/smoke-classic-check.sh \
            "${IMAGE}@${CHECK_DIGEST}" build/classic

      - name: Verify the published general digest
        env:
          GENERAL_DIGEST: ${{ steps.general-image.outputs.digest }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          if [[ ! "${GENERAL_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid general Windows digest: ${GENERAL_DIGEST}" >&2
            exit 1
          fi
          docker buildx imagetools inspect \
            "${IMAGE}@${GENERAL_DIGEST}" >/dev/null

      - name: Upload release native Windows test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classic-check-release-native-windows-tests
          path: build/classic/libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

  windows-native:
    name: Verify immutable Classic Check candidate on Windows
    needs: publish-candidates
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download release native Windows test bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-check-release-native-windows-tests
          path: build/native-windows-tests

      - name: Execute every Classic Check native test
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build/native-windows-tests").Path
          $env:PATH = "${bundle};${env:PATH}"
          $inventoryPath = Join-Path $bundle "classic-check-toolchain.json"
          $tests = (Get-Content -Raw $inventoryPath | ConvertFrom-Json).verification.native_tests
          if ($tests.Count -ne 6) { throw "Expected six declared native tests" }
          foreach ($test in $tests) {
            $executable = Join-Path $bundle $test.executable
            $arguments = @($test.arguments | ForEach-Object {
              if ([IO.Path]::IsPathRooted($_) -or $_ -like "../*" -or $_ -like "..\\*") {
                throw "Unsafe native-test argument: $_"
              }
              Join-Path $bundle $_
            })
            & $executable @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$($test.executable) failed: ${LASTEXITCODE}"
            }
          }

  promote:
    name: Promote verified Windows image aliases
    needs:
      - publish-candidates
      - windows-native
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified Classic Check aliases
        env:
          DIGEST: ${{ needs.publish-candidates.outputs.check_digest }}
          IMAGE: ${{ needs.publish-candidates.outputs.image }}
        run: |
          tags=(
            --tag "${IMAGE}:classic-check"
            --tag "${IMAGE}:classic-check-mxe"
          )
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tags+=(--tag "${IMAGE}:classic-check-${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"

      - name: Promote verified general Windows aliases
        env:
          DIGEST: ${{ needs.publish-candidates.outputs.general_digest }}
          IMAGE: ${{ needs.publish-candidates.outputs.image }}
        run: |
          tags=(--tag "${IMAGE}:latest" --tag "${IMAGE}:mxe")
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tags+=(--tag "${IMAGE}:${GITHUB_REF_NAME#v}")
          fi
          if ! docker buildx imagetools create \
              "${tags[@]}" "${IMAGE}@${DIGEST}"; then
            echo "General alias promotion failed after Classic promotion." >&2
            echo "Rerun this failed job in the same workflow run to converge" >&2
            echo "both alias sets on the already verified candidate digests." >&2
            exit 1
          fi
