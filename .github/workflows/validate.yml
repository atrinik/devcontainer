name: Validate build images

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed images
    runs-on: ubuntu-26.04
    outputs:
      classic: ${{ steps.changes.outputs.classic }}
      linux: ${{ steps.changes.outputs.linux }}
      windows: ${{ steps.changes.outputs.windows }}
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          classic=false
          linux=false
          windows=false
          while IFS= read -r path; do
            case "${path}" in
            .dockerignore | .github/actionlint.yaml | \
                .github/workflows/* | linux/* | \
                audio-toolchain.json | audio-toolchain.spdx.json | \
                toolchains.json | tools/audio/* | \
                tools/build-sdl3-mixer.sh | \
                tools/require-image-checks.sh | \
                tools/test-require-image-checks.sh | \
                tools/validate-toolchains.sh)
              linux=true
              ;;
            esac
            case "${path}" in
            .dockerignore | .github/workflows/publish-linux.yml | \
                .github/workflows/validate.yml | linux/* | \
                audio-toolchain.json | audio-toolchain.spdx.json | \
                classic-packages.lock | classic-toolchain.json | \
                tools/audio/* | tools/build-sdl3-mixer.sh | \
                tools/require-image-checks.sh | \
                tools/test-require-image-checks.sh | \
                tools/validate-classic-check.sh | \
                tools/validate-classic-image.sh)
              classic=true
              ;;
            esac
            case "${path}" in
            .dockerignore | .github/workflows/measure-classic-check.yml | \
                .github/workflows/publish-windows.yml | \
                .github/workflows/validate.yml | windows/* | \
                audio-toolchain.json | audio-toolchain.spdx.json | \
                tools/audio/* | \
                tools/build-sdl3-mixer.sh | \
                tools/measure-classic-check-images.sh | \
                tools/require-image-checks.sh | \
                tools/smoke-classic-check.sh | \
                tools/test-require-image-checks.sh | \
                tools/validate-toolchains.sh | \
                tools/verify-classic-check-package.py | \
                tools/verify-pe-imports.sh)
              windows=true
              ;;
            esac
          done < <(git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "classic=${classic}"
            echo "linux=${linux}"
            echo "windows=${windows}"
          } >> "${GITHUB_OUTPUT}"

      - name: Test required-check aggregation
        run: tools/test-require-image-checks.sh

  linux:
    name: Linux image
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Linux image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: linux/Dockerfile
          target: validation
          load: true
          tags: atrinik-linux-validation:ci
          cache-from: type=gha,scope=linux-build-image
          cache-to: type=gha,mode=max,scope=linux-build-image,ignore-error=true

      - name: Verify non-root gh-stack contract
        run: |
          docker run --rm \
            --user ubuntu \
            --env HOME=/home/ubuntu \
            --env GH_TOKEN=unused \
            atrinik-linux-validation:ci \
            sh -eu -c '
              test "$(gh version | sed -n "1s/^gh version \([^ ]*\) .*/\1/p")" = 2.97.0
              test "$(git version)" = "git version 2.53.0"
              test "$(gh extension list)" = "gh stack$(printf "\t")github/gh-stack$(printf "\t")v0.1.0"
              grep -Fx "owner: github" /home/ubuntu/.local/share/gh/extensions/gh-stack/manifest.yml
              grep -Fx "name: gh-stack" /home/ubuntu/.local/share/gh/extensions/gh-stack/manifest.yml
              grep -Fx "tag: v0.1.0" /home/ubuntu/.local/share/gh/extensions/gh-stack/manifest.yml
              grep -Fx "ispinned: true" /home/ubuntu/.local/share/gh/extensions/gh-stack/manifest.yml
              test "$(gh stack --version)" = "gh stack version 0.1.0"
              gh stack --help >/dev/null
              echo "358552dd7dce0a46ce153fe196270cec482b84f080947890aad4061a8d44bc0b  /home/ubuntu/.local/share/gh/extensions/gh-stack/gh-stack" | sha256sum -c -
            '

      - name: Verify gh-stack release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d "${RUNNER_TEMP}/gh-stack-attestation"
          gh release download v2.97.0 \
            --repo cli/cli \
            --pattern gh_2.97.0_linux_amd64.tar.gz \
            --dir "${RUNNER_TEMP}/gh-stack-attestation"
          gh release download v0.1.0 \
            --repo github/gh-stack \
            --pattern linux-amd64 \
            --dir "${RUNNER_TEMP}/gh-stack-attestation"
          cat <<EOF | sha256sum -c -
          a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  ${RUNNER_TEMP}/gh-stack-attestation/gh_2.97.0_linux_amd64.tar.gz
          358552dd7dce0a46ce153fe196270cec482b84f080947890aad4061a8d44bc0b  ${RUNNER_TEMP}/gh-stack-attestation/linux-amd64
          EOF
          tar -xzf \
            "${RUNNER_TEMP}/gh-stack-attestation/gh_2.97.0_linux_amd64.tar.gz" \
            -C "${RUNNER_TEMP}/gh-stack-attestation"
          "${RUNNER_TEMP}/gh-stack-attestation/gh_2.97.0_linux_amd64/bin/gh" \
            attestation verify \
            "${RUNNER_TEMP}/gh-stack-attestation/linux-amd64" \
            --repo github/gh-stack \
            --signer-workflow github/gh-stack/.github/workflows/release.yml \
            --source-ref refs/tags/v0.1.0 \
            --source-digest a1b4a3d4d0bcde9ec3a78ab99b2d63af121857a9 \
            --signer-digest a1b4a3d4d0bcde9ec3a78ab99b2d63af121857a9 \
            --format json \
            | jq -e '
                any(
                  .[].verificationResult.statement.subject[];
                  .name == "linux-amd64"
                  and .digest.sha256 ==
                    "358552dd7dce0a46ce153fe196270cec482b84f080947890aad4061a8d44bc0b"
                )
              '

  windows:
    name: Windows cross-build images
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select immutable Classic Check consumer
        id: classic
        run: |
          classic_ref=$(jq -er '.consumer.validation_commit' \
            windows/classic-check-toolchain.json)
          if [[ ! "${classic_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Classic validation commit: ${classic_ref}" >&2
            exit 1
          fi
          echo "ref=${classic_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out immutable Classic Check consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.classic.outputs.ref }}
          path: build/classic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Validate Classic Check inventory
        run: |
          tools/validate-toolchains.sh \
            toolchains.json '' \
            audio-toolchain.json '' \
            audio-toolchain.spdx.json '' \
            windows/classic-check-toolchain.json

      - name: Build general Windows image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          outputs: type=cacheonly
          build-args: MXE_BUILD_JOBS=4
          cache-from: |
            type=gha,scope=windows-build-image
          cache-to: type=gha,mode=max,scope=windows-build-image,ignore-error=true

      - name: Build task-focused Classic Check image
        id: classic-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          target: classic-check
          load: true
          tags: atrinik-windows-check:validation
          build-args: MXE_BUILD_JOBS=4
          cache-from: |
            type=gha,scope=windows-classic-check-image
            type=gha,scope=windows-build-image
          cache-to: type=gha,mode=max,scope=windows-classic-check-image,ignore-error=true

      - name: Resolve immutable Classic Check candidate
        id: candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.classic-image.outputs.digest }}
          CANDIDATE_IMAGE_ID: ${{ steps.classic-image.outputs.imageid }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out revision does not match GITHUB_SHA" >&2
            exit 1
          fi
          if [[ ! "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid candidate digest: ${CANDIDATE_DIGEST}" >&2
            exit 1
          fi
          if [[ ! "${CANDIDATE_IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid candidate image ID: ${CANDIDATE_IMAGE_ID}" >&2
            exit 1
          fi
          docker image inspect "${CANDIDATE_IMAGE_ID}" >/dev/null
          {
            echo "image=${CANDIDATE_IMAGE_ID}"
            echo "build_digest=${CANDIDATE_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cross-build and stage the complete Classic Check bundle
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: tools/smoke-classic-check.sh "${CANDIDATE_IMAGE}" build/classic

      - name: Upload native Windows test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classic-check-native-windows-tests
          path: build/classic/libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

  windows-native:
    name: Classic Check native Windows tests
    needs:
      - changes
      - windows
    if: needs.changes.outputs.windows == 'true'
    permissions: {}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download native Windows test bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-check-native-windows-tests
          path: build/native-windows-tests

      - name: Execute every Classic Check native test
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build/native-windows-tests").Path
          $env:PATH = "${bundle};${env:PATH}"
          $inventoryPath = Join-Path $bundle "classic-check-toolchain.json"
          $tests = (Get-Content -Raw $inventoryPath | ConvertFrom-Json).verification.native_tests
          if ($tests.Count -ne 6) { throw "Expected six declared native tests" }
          foreach ($test in $tests) {
            $executable = Join-Path $bundle $test.executable
            $arguments = @($test.arguments | ForEach-Object {
              if ([IO.Path]::IsPathRooted($_) -or $_ -like "../*" -or $_ -like "..\\*") {
                throw "Unsafe native-test argument: $_"
              }
              Join-Path $bundle $_
            })
            & $executable @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$($test.executable) failed: ${LASTEXITCODE}"
            }
          }

  classic:
    name: Classic CI image
    needs: changes
    if: needs.changes.outputs.classic == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Classic validation revision
        id: consumer
        run: echo "commit=$(jq -r '.consumer_validation.commit' classic-toolchain.json)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and smoke Classic validation target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: linux/Dockerfile
          target: classic-validation
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=classic-build-image
          cache-to: type=gha,mode=max,scope=classic-build-image,ignore-error=true

      - name: Load slim Classic image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: linux/Dockerfile
          target: classic-final
          platforms: linux/amd64
          load: true
          tags: atrinik-classic-build:validation
          cache-from: type=gha,scope=classic-build-image

      - name: Check out pinned Classic sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.consumer.outputs.commit }}
          path: classic

      - name: Run Classic client and server checks as the runner user
        run: |
          install -d -m 1777 "${RUNNER_TEMP}/classic-ccache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CCACHE_DIR=/cache/ccache \
            --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/image-source:ro" \
            --volume "${GITHUB_WORKSPACE}/classic:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache:/cache/ccache" \
            --workdir /workspace \
            atrinik-classic-build:validation \
            /image-source/tools/validate-classic-check.sh /workspace

  required:
    name: Required checks
    needs:
      - changes
      - classic
      - linux
      - windows
      - windows-native
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out required-check helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require successful applicable validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLASSIC_SELECTED: ${{ needs.changes.outputs.classic }}
          CLASSIC_RESULT: ${{ needs.classic.result }}
          LINUX_SELECTED: ${{ needs.changes.outputs.linux }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_SELECTED: ${{ needs.changes.outputs.windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: |
          tools/require-image-checks.sh \
            "${CHANGES_RESULT}" \
            "${CLASSIC_SELECTED}" "${CLASSIC_RESULT}" \
            "${LINUX_SELECTED}" "${LINUX_RESULT}" \
            "${WINDOWS_SELECTED}" "${WINDOWS_RESULT}" \
            "${WINDOWS_NATIVE_RESULT}"
