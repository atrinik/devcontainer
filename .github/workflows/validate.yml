name: Validate build images

on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: validate-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed images
    runs-on: ubuntu-26.04
    outputs:
      linux: ${{ steps.changes.outputs.linux }}
      windows: ${{ steps.changes.outputs.windows }}
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          linux=false
          windows=false
          while IFS= read -r path; do
            case "${path}" in
            .dockerignore | .github/actionlint.yaml | \
                .github/workflows/* | linux/* | \
                audio-toolchain.json | audio-toolchain.spdx.json | \
                toolchains.json | tools/audio/* | \
                tools/build-sdl3-mixer.sh | tools/validate-toolchains.sh)
              linux=true
              ;;
            esac
            case "${path}" in
            .dockerignore | .github/workflows/publish-windows.yml | \
                .github/workflows/validate.yml | windows/* | \
                audio-toolchain.json | audio-toolchain.spdx.json | \
                tools/audio/* | \
                tools/build-sdl3-mixer.sh | \
                tools/measure-classic-check-images.sh | \
                tools/smoke-classic-check.sh | \
                tools/validate-toolchains.sh | \
                tools/verify-classic-check-package.py | \
                tools/verify-pe-imports.sh)
              windows=true
              ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "linux=${linux}"
            echo "windows=${windows}"
          } >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux image
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Linux image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: linux/Dockerfile
          target: validation
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/linux-build:ubuntu-26.04
            type=gha,scope=linux-build-image
          cache-to: type=gha,mode=max,scope=linux-build-image,ignore-error=true

  windows:
    name: Windows cross-build images
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Check out image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select immutable Classic Check consumer
        id: classic
        run: |
          classic_ref=$(jq -er '.consumer.validation_commit' \
            windows/classic-check-toolchain.json)
          if [[ ! "${classic_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Classic validation commit: ${classic_ref}" >&2
            exit 1
          fi
          echo "ref=${classic_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out immutable Classic Check consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atrinik/classic
          ref: ${{ steps.classic.outputs.ref }}
          path: build/classic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate Classic Check inventory
        run: |
          tools/validate-toolchains.sh \
            toolchains.json '' \
            audio-toolchain.json '' \
            audio-toolchain.spdx.json '' \
            windows/classic-check-toolchain.json

      - name: Build general Windows image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          outputs: type=cacheonly
          build-args: MXE_BUILD_JOBS=4
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/windows-build:mxe
            type=gha,scope=windows-build-image
          cache-to: type=gha,mode=max,scope=windows-build-image,ignore-error=true

      - name: Build task-focused Classic Check image
        id: classic-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: windows/Dockerfile
          target: classic-check
          load: true
          tags: atrinik-windows-check:validation
          build-args: MXE_BUILD_JOBS=4
          cache-from: |
            type=registry,ref=ghcr.io/atrinik/windows-check:mxe
            type=registry,ref=ghcr.io/atrinik/windows-build:mxe
            type=gha,scope=windows-classic-check-image
            type=gha,scope=windows-build-image
          cache-to: type=gha,mode=max,scope=windows-classic-check-image,ignore-error=true

      - name: Resolve immutable Classic Check candidate
        id: candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.classic-image.outputs.digest }}
          CANDIDATE_IMAGE_ID: ${{ steps.classic-image.outputs.imageid }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out revision does not match GITHUB_SHA" >&2
            exit 1
          fi
          if [[ ! "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid candidate digest: ${CANDIDATE_DIGEST}" >&2
            exit 1
          fi
          if [[ ! "${CANDIDATE_IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid candidate image ID: ${CANDIDATE_IMAGE_ID}" >&2
            exit 1
          fi
          docker image inspect "${CANDIDATE_IMAGE_ID}" >/dev/null
          {
            echo "image=${CANDIDATE_IMAGE_ID}"
            echo "build_digest=${CANDIDATE_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cross-build and stage the complete Classic Check bundle
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: tools/smoke-classic-check.sh "${CANDIDATE_IMAGE}" build/classic

      - name: Measure pinned and task-focused images
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          MEASUREMENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MEASUREMENT_BUILD_DIGEST: ${{ steps.candidate.outputs.build_digest }}
          MEASUREMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MEASUREMENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          tools/measure-classic-check-images.sh \
            ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7 \
            "${CANDIDATE_IMAGE}" \
            build/measurements
          cat build/measurements/classic-check-image-measurements.md \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload native Windows test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classic-check-native-windows-tests
          path: build/classic/libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

      - name: Upload image measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classic-check-image-measurements
          path: build/measurements
          if-no-files-found: error
          retention-days: 30

  windows-native:
    name: Classic Check native Windows tests
    needs:
      - changes
      - windows
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download native Windows test bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-check-native-windows-tests
          path: build/native-windows-tests

      - name: Execute every Classic Check native test
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build/native-windows-tests").Path
          $env:PATH = "${bundle};${env:PATH}"
          $inventoryPath = Join-Path $bundle "classic-check-toolchain.json"
          $tests = (Get-Content -Raw $inventoryPath | ConvertFrom-Json).verification.native_tests
          if ($tests.Count -ne 6) { throw "Expected six declared native tests" }
          foreach ($test in $tests) {
            $executable = Join-Path $bundle $test.executable
            $arguments = @($test.arguments | ForEach-Object {
              if ([IO.Path]::IsPathRooted($_) -or $_ -like "../*" -or $_ -like "..\\*") {
                throw "Unsafe native-test argument: $_"
              }
              Join-Path $bundle $_
            })
            & $executable @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$($test.executable) failed: ${LASTEXITCODE}"
            }
          }

  required:
    name: Required checks
    needs:
      - changes
      - linux
      - windows
      - windows-native
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require successful applicable validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: |
          if [[ "${CHANGES_RESULT}" != success ]]; then
            echo "Change selection concluded ${CHANGES_RESULT}." >&2
            exit 1
          fi

          for result in "${LINUX_RESULT}" "${WINDOWS_RESULT}" \
              "${WINDOWS_NATIVE_RESULT}"; do
            if [[ "${result}" != success && "${result}" != skipped ]]; then
              echo "Image validation concluded ${result}." >&2
              exit 1
            fi
          done
